# Bước 1: kiểm tra mọi file .html (html-validate), link nội bộ và thẻ SEO.
# Bước 2: deploy lên GitHub Pages — chỉ khi push (hoặc chạy tay) trên nhánh main.
name: Kiểm tra & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiem-tra:
    name: Kiểm tra HTML và link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: html-validate cho mọi file .html
        run: npm run validate
      - name: "Link nội bộ, #anchor, canonical, Open Graph, sitemap"
        run: npm run links
      - name: Test các công cụ trong tools/
        run: npm run test:unit

  deploy:
    name: Deploy GitHub Pages
    needs: kiem-tra
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Gom file website vào _site (bỏ docs/, tools/, README và file cấu hình)
        run: |
          rsync -a \
            --exclude='.*' --exclude='node_modules/' --exclude='_site/' \
            --exclude='docs/' --exclude='tools/' \
            --exclude='README.md' --exclude='package.json' --exclude='package-lock.json' \
            ./ _site/
          find _site -type f | sort
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
