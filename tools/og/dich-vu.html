<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nguồn ảnh OG: trang dịch vụ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&amp;display=swap">
<link rel="stylesheet" href="og.css">
<style>
  .og {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 40px;
    align-items: center;
    padding: 64px 72px;
    background: #fffbf5;
    color: #16323d;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 40px;
    font-weight: 700;
  }

  .brand svg {
    width: 44px;
    height: 55px;
  }

  h1 {
    margin-top: 34px;
    font-size: 58px;
    line-height: 1.18;
    letter-spacing: -0.015em;
  }

  .sub {
    margin-top: 24px;
    color: #4e6470;
    font-size: 28px;
    line-height: 1.45;
  }

  .greetings {
    position: relative;
    height: 100%;
  }

  .bubble {
    position: absolute;
    padding: 18px 30px;
    border-radius: 999px;
    font-size: 36px;
    font-weight: 700;
    white-space: nowrap;
  }

  .b1 {
    top: 60px;
    left: 0;
    background: #0b6e8c;
    color: #fff;
  }

  .b2 {
    top: 190px;
    right: 0;
    border: 3px solid #cfe2e7;
    background: #fff;
    color: #0b6e8c;
  }

  .b3 {
    top: 320px;
    left: 20px;
    background: #b5441c;
    color: #fff;
  }

</style>
</head>
<body>
<div class="og">
  <div>
    <p class="brand"><svg viewBox="0 0 32 40" aria-hidden="true"><path d="M8 2h16a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6h-4.6L16 37.5 12.6 28H8a6 6 0 0 1-6-6V8a6 6 0 0 1 6-6z" fill="#0b6e8c"/><path d="M9 11.5h14M9 18h8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="22.5" cy="18" r="2.2" fill="#e8643a"/></svg>Chào Khách</p>
    <h1>Thêm khách từ Google Maps và khách nước ngoài</h1>
    <p class="sub">Google Maps, website song ngữ, menu QR cho homestay, spa, quán ăn ở Đà Nẵng</p>
  </div>
  <div class="greetings" aria-hidden="true">
    <p class="bubble b1">Xin chào!</p>
    <p class="bubble b2">Hello!</p>
    <p class="bubble b3" lang="ko">안녕하세요!</p>
  </div>
</div>
</body>
</html>
