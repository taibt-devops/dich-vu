<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nguồn ảnh OG: mẫu spa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&amp;family=Cormorant+Garamond:wght@600&amp;display=swap">
<link rel="stylesheet" href="og.css">
<style>
  .og {
    padding: 64px 72px;
    background: linear-gradient(160deg, #45634d, #5b7b62);
    color: #fff;
  }

  .badge {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 999px;
    background: #2d2b27;
    font-size: 24px;
    font-weight: 700;
  }

  h1 {
    margin-top: 34px;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 112px;
    font-weight: 600;
    line-height: 1;
  }

  .sub {
    margin-top: 16px;
    font-size: 38px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    max-width: 760px;
    margin-top: 34px;
  }

  .chips span {
    padding: 8px 22px;
    border: 2px solid rgb(255 255 255 / 0.7);
    border-radius: 999px;
    font-size: 26px;
    font-weight: 700;
  }

  .leaves {
    position: absolute;
    right: 70px;
    bottom: 70px;
    width: 330px;
    height: auto;
  }

  .by {
    position: absolute;
    bottom: 34px;
    left: 72px;
    font-size: 26px;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="og">
  <p class="badge">Website mẫu</p>
  <h1>Lụa Spa</h1>
  <p class="sub">Massage, gội đầu dưỡng sinh ở An Thượng, Đà Nẵng</p>
  <p class="chips"><span>Tiếng Việt</span><span>English</span><span lang="ko">한국어</span><span lang="ko">노팁</span></p>
  <svg class="leaves" viewBox="0 0 120 100" aria-hidden="true">
    <path d="M70 8c26 12 36 40 22 68C66 66 56 36 70 8z" fill="#e6d3bd" opacity=".9"/>
    <path d="M38 34c19 3 28 20 24 40-19-4-28-20-24-40z" fill="#b8926a"/>
  </svg>
  <p class="by">Làm bởi Chào Khách: website song ngữ cho tiệm ở Đà Nẵng</p>
</div>
</body>
</html>
