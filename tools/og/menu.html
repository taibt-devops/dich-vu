<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nguồn ảnh OG: mẫu menu QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700;800&amp;display=swap">
<link rel="stylesheet" href="og.css">
<style>
  .og {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 48px;
    align-items: center;
    padding: 56px 72px;
    background: #fff;
    color: #1c2530;
  }

  .badge {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 999px;
    background: #1c2530;
    color: #fff;
    font-size: 24px;
    font-weight: 700;
  }

  h1 {
    margin-top: 28px;
    color: #c2412d;
    font-size: 78px;
    font-weight: 800;
    line-height: 1.05;
  }

  .sub {
    margin-top: 18px;
    font-size: 36px;
    line-height: 1.3;
  }

  .langs {
    display: flex;
    gap: 14px;
    margin-top: 30px;
  }

  .langs span {
    padding: 8px 22px;
    border: 2px solid #e9e2dd;
    border-radius: 999px;
    font-size: 26px;
    font-weight: 700;
  }

  .phone {
    height: 520px;
    padding: 18px;
    border-radius: 44px;
    background: #1c2530;
  }

  .screen {
    height: 100%;
    overflow: hidden;
    border-radius: 30px;
    background: #fff;
  }

  .screen-top {
    padding: 22px 22px 18px;
    background: #c2412d;
    color: #fff;
    font-size: 26px;
    font-weight: 800;
  }

  .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 22px;
    border-bottom: 2px dashed #e9e2dd;
    font-size: 22px;
  }

  .row b {
    display: block;
  }

  .row small {
    color: #5a6470;
    font-size: 17px;
  }

  .row span:last-child {
    color: #0f5c6e;
    font-weight: 800;
    white-space: nowrap;
  }

  .by {
    position: absolute;
    bottom: 30px;
    left: 72px;
    color: #5a6470;
    font-size: 24px;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="og">
  <div>
    <p class="badge">Website mẫu</p>
    <h1>Hải Sản Nhà Chài</h1>
    <p class="sub">Menu QR 3 thứ tiếng, giá theo kg cho hải sản tươi</p>
    <p class="langs"><span>Tiếng Việt</span><span>English</span><span lang="ko">한국어</span></p>
  </div>
  <div class="phone" aria-hidden="true">
    <div class="screen">
      <p class="screen-top" lang="ko">활해산물 · kg당 가격</p>
      <p class="row"><span><b lang="ko">랍스터</b><small>Tôm hùm bông</small></span><span>1.800.000₫</span></p>
      <p class="row"><span><b lang="ko">머드크랩</b><small>Cua thịt</small></span><span>750.000₫</span></p>
      <p class="row"><span><b lang="ko">타이거 새우</b><small>Tôm sú</small></span><span>650.000₫</span></p>
      <p class="row"><span><b lang="ko">갯가재</b><small>Bề bề</small></span><span>600.000₫</span></p>
    </div>
  </div>
  <p class="by">Làm bởi Chào Khách: website song ngữ cho tiệm ở Đà Nẵng</p>
</div>
</body>
</html>
