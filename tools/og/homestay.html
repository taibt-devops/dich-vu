<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nguồn ảnh OG: mẫu homestay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&amp;family=Lora:wght@600&amp;display=swap">
<link rel="stylesheet" href="og.css">
<style>
  .og {
    padding: 64px 72px;
    background: linear-gradient(160deg, #1b557d, #2b77a0);
    color: #fff;
  }

  .badge {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 999px;
    background: #1f2a33;
    font-size: 24px;
    font-weight: 700;
  }

  h1 {
    margin-top: 40px;
    font-family: "Lora", Georgia, serif;
    font-size: 84px;
    font-weight: 600;
    line-height: 1.05;
  }

  .sub {
    margin-top: 18px;
    font-size: 38px;
  }

  .langs {
    display: flex;
    gap: 14px;
    margin-top: 34px;
  }

  .langs span {
    padding: 8px 22px;
    border: 2px solid rgb(255 255 255 / 0.7);
    border-radius: 999px;
    font-size: 26px;
    font-weight: 700;
  }

  .sun {
    position: absolute;
    right: 120px;
    bottom: 120px;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    background: #f2a541;
  }

  .waves {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    width: 1200px;
    height: 150px;
  }

  .by {
    position: absolute;
    bottom: 34px;
    left: 72px;
    z-index: 1;
    color: #1f2a33;
    font-size: 26px;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="og">
  <p class="badge">Website mẫu</p>
  <h1>Gió Nồm Homestay</h1>
  <p class="sub">Phòng gần biển Mỹ Khê, Đà Nẵng</p>
  <p class="langs"><span>Tiếng Việt</span><span>English</span><span lang="ko">한국어</span></p>
  <div class="sun"></div>
  <svg class="waves" viewBox="0 0 1200 150" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 50C150 20 300 80 450 50S750 20 900 50s200 30 300 0v100H0z" fill="#fff" opacity=".16"/>
    <path d="M0 82C150 52 300 112 450 82S750 52 900 82s200 30 300 0v68H0z" fill="#fff" opacity=".24"/>
    <path d="M0 112C150 92 300 132 450 112S750 92 900 112s200 20 300 0v38H0z" fill="#fbf7f0"/>
  </svg>
  <p class="by">Làm bởi Chào Khách: website song ngữ cho tiệm ở Đà Nẵng</p>
</div>
</body>
</html>
